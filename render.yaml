# Blueprint de referencia para Render.
# Si el backend ya existe en el panel, crea solo el Cron Job manualmente (ver docs/RENDER_CRON.md).

services:
  - type: web
    name: agroconecta-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: agroconecta-db
          property: connectionString

  - type: cron
    name: agroconecta-recordatorios
    runtime: python
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py enviar_recordatorios
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: agroconecta-db
          property: connectionString

databases:
  - name: agroconecta-db
    plan: free
